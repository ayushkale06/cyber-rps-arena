<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPS Cyber Arena</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#66fcf1">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <button id="btn-lang" class="cyber-btn outline-btn" style="position:absolute; top:10px; right:10px; width:auto; z-index:100; font-size: 0.8rem;">[ EN ]</button>

    <!-- TOURNAMENT OVERLAY -->
    <div id="tourney-overlay" class="overlay hidden">
        <h1 id="tourney-result-text">GRAND CHAMPION</h1>
        <p class="l33t-target">Tournament Complete.</p>
        <button id="btn-replay" class="cyber-btn mt-20 l33t-target" style="max-width: 250px; background:#f59e0b; color:#0b0c10; border-color:#f59e0b;">🎥 WATCH REPLAY</button>
        <button id="btn-rematch" class="cyber-btn mt-20 hidden l33t-target" style="max-width: 250px;">INITIATE REMATCH</button>
        <button id="btn-menu" class="cyber-btn outline-btn mt-20 l33t-target" style="max-width: 250px;">RETURN TO GRID</button>
    </div>

    <div class="game-wrapper">
        <header>
            <h1 class="game-title">CYBER <span class="accent">RPS</span></h1>
            <p class="subtitle l33t-target">Ludicrous Edition</p>
        </header>

        <!-- LOBBY SCREEN -->
        <div id="lobby-screen" class="container">
            <h2 class="l33t-target">ENTER THE GRID</h2>
            
            <div style="display:flex; justify-content:center; gap:20px; margin-bottom: 10px;">
                <div id="xp-display" style="color: #4ade80; font-weight: bold;" class="l33t-target">LVL 1 (0/100 XP)</div>
                <div id="bank-display" style="color: #f59e0b; font-weight: bold;" class="l33t-target">BANK: 1000 ₵</div>
            </div>

            <div class="avatar-selector" id="avatar-container">
                <label><input type="radio" name="avatar" value="🤖" checked><span>🤖</span></label>
                <label><input type="radio" name="avatar" value="👽"><span>👽</span></label>
                <label><input type="radio" name="avatar" value="👾"><span>👾</span></label>
                <label><input type="radio" name="avatar" value="💀"><span>💀</span></label>
                <label><input type="radio" name="avatar" value="🦊"><span>🦊</span></label>
                <label><input type="radio" name="avatar" value="💻"><span>💻</span></label>
                <label id="avatar-king" class="hidden"><input type="radio" name="avatar" value="👑"><span>👑</span></label>
                <label id="avatar-dragon" class="hidden"><input type="radio" name="avatar" value="🐉"><span>🐉</span></label>
            </div>

            <input type="text" id="username-input" class="l33t-target-placeholder" placeholder="ENTER ALIAS..." maxlength="12">
            
            <div style="margin-bottom:15px; display:flex; align-items:center; justify-content:center; gap:10px;">
                <span class="l33t-target" style="color:#45a29e; font-weight:bold;">WAGER ₵:</span>
                <input type="number" id="wager-input" value="10" min="1" max="1000" style="width:100px; margin:0; text-align:center;" class="l33t-target-placeholder">
            </div>

            <div class="lobby-actions">
                <div class="join-room-box" style="margin-bottom: 10px;">
                    <button id="btn-quick" class="cyber-btn l33t-target">QUICK MATCH</button>
                    <button id="btn-ai" class="cyber-btn outline-btn l33t-target">VS MAINFRAME</button>
                </div>
                <div class="divider l33t-target">OR</div>
                <button id="btn-create" class="cyber-btn l33t-target" style="margin-bottom: 10px;">CREATE ROOM</button>
                <div class="join-room-box">
                    <input type="text" id="room-code-input" class="l33t-target-placeholder" placeholder="ROOM CODE" maxlength="4">
                    <button id="btn-join" class="cyber-btn l33t-target">JOIN / SPECTATE</button>
                </div>
            </div>
            <p id="lobby-error" class="error-msg"></p>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="container hidden">
            
            <div class="top-bar">
                <div style="display:flex; justify-content:space-between; margin-bottom:5px; font-size:0.8rem; font-weight:bold;">
                    <span style="color:#f59e0b;">BANK: <span id="game-bank">1000</span> ₵</span>
                    <span style="color:#ff007f;">WAGER: <span id="game-wager">10</span> ₵</span>
                </div>
                
                <div id="timer-container" class="timer-container hidden">
                    <div id="timer-bar" class="timer-bar"></div>
                </div>

                <div class="score-board">
                    <div class="player-score">
                        <span id="my-name-display">YOU <span id="my-level-display" style="color: #4ade80;">[Lv1]</span></span>
                        <div class="score-info">
                            <span id="my-avatar" class="avatar-display">🤖</span>
                            <div id="my-score" class="score-num">0</div>
                        </div>
                    </div>
                    <div class="vs-text">VS</div>
                    <div class="player-score opp-side">
                        <span id="opp-name-display">ENEMY <span id="opp-level-display" style="color: #4ade80;">[Lv1]</span></span>
                        <div class="score-info">
                            <div id="opp-score" class="score-num">0</div>
                            <span id="opp-avatar" class="avatar-display">👽</span>
                        </div>
                    </div>
                </div>
            </div>

            <div id="status" class="status l33t-target">AWAITING CONNECTION...</div>

            <div id="game-area" class="hidden">
                <div id="spectator-msg" class="hidden l33t-target" style="color: #45a29e; font-weight: bold; margin-bottom: 15px;">SPECTATOR MODE - OBSERVING MATCH</div>
                <div id="replay-msg" class="hidden l33t-target" style="color: #f59e0b; font-weight: bold; margin-bottom: 15px; animation: pulse 1s infinite;">CINEMATIC REPLAY ACTIVE</div>
                
                <!-- NEW CONTROLS -->
                <div class="extra-controls hidden" id="extra-controls" style="display:flex; justify-content:center; gap:10px; margin-bottom: 15px; flex-wrap:wrap;">
                    <button id="btn-mic" class="cyber-btn outline-btn l33t-target" style="width:auto;"><span class="icon" style="font-size:1.2rem; margin:0;">🎤</span> VOICE</button>
                    <button id="btn-cam" class="cyber-btn outline-btn l33t-target" style="width:auto; border-color:#00ffaa; color:#00ffaa;"><span class="icon" style="font-size:1.2rem; margin:0;">📸</span> CAM</button>
                    <button id="btn-scan" class="cyber-btn hidden l33t-target" style="width:auto; background:#00ffaa; color:#0b0c10;">ANALYZE</button>
                    <button id="btn-hack" class="cyber-btn hack-btn l33t-target" style="width:auto; display:none;">⚠️ OVERRIDE (1)</button>
                </div>
                
                <div id="cam-container" class="hidden" style="position:relative; width: 120px; height: 90px; margin: 0 auto 15px auto; border: 2px solid #00ffaa; border-radius: 10px; overflow:hidden;">
                    <video id="webcam" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
                    <div id="scan-line" class="hidden" style="position:absolute; top:0; left:0; width:100%; height:2px; background:#00ffaa; box-shadow:0 0 15px #00ffaa;"></div>
                </div>

                <div class="choices" id="choices-container">
                    <button class="choice-btn rock" data-choice="rock"><span class="icon">🪨</span></button>
                    <button class="choice-btn paper" data-choice="paper"><span class="icon">📄</span></button>
                    <button class="choice-btn scissors" data-choice="scissors"><span class="icon">✂️</span></button>
                    <button class="choice-btn lizard" data-choice="lizard"><span class="icon">🦎</span></button>
                    <button class="choice-btn spock" data-choice="spock"><span class="icon">🖖</span></button>
                </div>
                
                <div id="result-area" class="hidden result-card">
                    <h2 id="round-result" class="result-text l33t-target"></h2>
                    <div class="matchup">
                        <div id="my-choice" class="choice-display"></div>
                        <div class="vs">VS</div>
                        <div id="opp-choice" class="choice-display"></div>
                    </div>
                </div>
            </div>

            <div class="bottom-panels hidden" id="bottom-panels">
                <div id="combat-log-container" class="panel">
                    <h3 class="panel-header l33t-target">COMBAT LOG</h3>
                    <div id="combat-log" class="log-messages l33t-target"></div>
                </div>
                <div id="chat-container" class="panel">
                    <h3 class="panel-header l33t-target">COMMS</h3>
                    <div id="chat-messages" class="chat-messages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="chat-input" class="l33t-target-placeholder" placeholder="Transmit...">
                        <button id="btn-send-chat" class="cyber-btn small-btn l33t-target">SEND</button>
                    </div>
                </div>
            </div>
            
            <button id="btn-quit" class="cyber-btn small-btn outline-btn mt-20 l33t-target">DISCONNECT</button>
        </div>
    </div>

    <!-- MEDIAPIPE ML INTEGRATION -->
    <script type="module">
        import { GestureRecognizer, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";
        
        let gestureRecognizer = null;
        
        async function initML() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm");
                gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO"
                });
                console.log("Neural Net Loaded successfully!");
                window.mlReady = true;
            } catch (e) {
                console.error("ML Load Error:", e);
            }
        }
        initML();

        window.scanHandGesture = () => {
            if(!gestureRecognizer) return null;
            const video = document.getElementById('webcam');
            if(video.videoWidth === 0) return null; // Video not active
            
            const results = gestureRecognizer.recognizeForVideo(video, Date.now());
            if (results.gestures.length > 0) {
                const categoryName = results.gestures[0][0].categoryName;
                console.log("ML Detected:", categoryName);
                if(categoryName === 'Closed_Fist') return 'rock';
                if(categoryName === 'Open_Palm') return 'paper';
                if(categoryName === 'Victory') return 'scissors';
                if(categoryName === 'Thumb_Up') return 'spock';
                if(categoryName === 'Thumb_Down') return 'lizard';
            }
            return null;
        }
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
